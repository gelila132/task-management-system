<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Management System</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="app">
    <header class="page-header">
     <h1>Task Management System</h1>

  <button id="themeToggle" type="button">🌙 Dark mode</button>
      <p class="subtitle">Make a plan. Take the next step.</p>
    </header>

    <section class="panel" aria-labelledby="add-heading">
      <h2 id="add-heading">Add a task</h2>
      <form id="taskForm">
        <label for="taskInput">Task name</label>
        <div class="form-row">
          <input id="taskInput" name="task" type="text" placeholder="e.g. Practice JavaScript" maxlength="120" autocomplete="off">
          <select id="categoryInput">
    <option value="Study">Study</option>
    <option value="Work">Work</option>
    <option value="Personal">Personal</option>
    <option value="Health">Health</option>
</select>

          <select id="priorityInput" name="priority" aria-label="Task priority"class="priority-input">
            <option value="low">Low priority</option>
            <option value="medium" selected>Medium priority</option>
            <option value="high">High priority</option>
          </select>
          <label for="deadlineInput" class="deadline-label">
  📅 Deadline
</label>
<input
  type="date"
  id="deadlineInput"
  aria-label="Task Deadline"
  class="deadline-input"
>
          </div>
          <button type="submit">Add task</button>
        
        <p id="formMessage" class="message" role="status" aria-live="polite"></p>
      </form>
    </section>
    <div class="toolbar">
</div>

<!-- <button id="exportBtn" type="button">
  Export JSON
</button> -->

<ul id="taskList" class="task-list"></ul>

    <section class="stats" aria-label="Task statistics">
      <article class="stat-card"><span>Total</span><strong id="totalCount">0</strong></article>
      <article class="stat-card"><span>Pending</span><strong id="pendingCount">0</strong></article>
      <article class="stat-card"><span>Completed</span><strong id="completedCount">0</strong></article>
    </section>

    <section class="panel" aria-labelledby="tasks-heading">
     <div class="list-heading">
    <h2 id="tasks-heading">Your task list</h2>

    <div>
        <span id="visibleCount">0 tasks</span>
        <button id="exportBtn" type="button">
            Export JSON
        </button>
    </div>
</div>
      <div class="toolbar">
        <label class="search-label" for="searchInput">Search tasks</label>
        <input id="searchInput" type="search" placeholder="Search by task name...">
        <label class="filter-label" for="filterSelect">Show</label>
        <select id="filterSelect">
          <option value="all">All tasks</option>
          <option value="pending">Pending</option>
          <option value="completed">Completed</option>
        </select>
      </div>
      <ul id="taskList" class="task-list"></ul>
      <p id="emptyState" class="empty-state">No tasks yet. Add your first task above.</p>
    </section>

    <footer>Tasks are saved in this browser on this device.</footer>
  </main>
</body>
</html>
